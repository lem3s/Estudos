syntax = "proto3";

package estoque.v1;

service Estoque {
  // Unário: 1 requisição -> 1 resposta.
  rpc Reservar (ReservarRequest) returns (ReservarResponse);

  // Streaming de servidor: 1 requisição -> N respostas na mesma conexão.
  rpc Observar (SkuQuery) returns (stream EventoEstoque);
}

message ReservarRequest {
  string sku = 1;
  int32 qtd = 2;
  string pedido_id = 3;
  // Campo 4 removido na v1.2 — nunca reaproveitar o número:
  // reserved 4;
}

message ReservarResponse {
  string reserva_id = 1;
  int32 restante = 2;
}

message SkuQuery {
  string sku = 1;
}

message EventoEstoque {
  string sku = 1;
  int32 disponivel = 2;
  string motivo = 3;
}
